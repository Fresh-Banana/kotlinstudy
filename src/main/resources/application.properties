spring.application.name=kotlinchating

# DB (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/kotlinchating
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Session (stored in DB via spring-session-jdbc)
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# JWT
jwt.secret=change-this-to-a-long-random-secret-in-production
jwt.access-token-validity-ms=3600000
jwt.refresh-token-validity-ms=1209600000
